name: "Scora | Build Runtime Image"

on:
  push:
    branches:
      - master
      - 'feat/**'
    paths:
      - 'Dockerfile.base'
      - 'package.json'
  workflow_dispatch:

# Permissions required to push to GHCR
permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: "Publish Base Image to GHCR"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧼 Sanitize Branch Name
        id: slug
        run: echo "tag=$(echo ${{ github.ref_name }} | sed 's/\//-/g')" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/scora-runtime:${{ github.ref_name == 'master' && 'latest' || 'staging' }}
            ghcr.io/${{ github.repository_owner }}/scora-runtime:${{ steps.slug.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/scora-runtime:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
