name: "Scora | Midnight E2ERegression"

on:
  schedule:
    - cron: '0 0 * * *' # Every night at 00:00 UTC
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Auto-update Linux snapshots for regression tests'
        required: false
        type: boolean
        default: false

jobs:
  regression:
    name: "Full API Integrity Check (Vercel)"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: ghcr.io/${{ github.repository_owner }}/scora-runtime:latest
      options: --user root # Ensure we have permissions for pnpm/playwright
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up configuration file
        run: cp src/config.example.ts src/config.ts

      - name: Run Unit Tests (Vitest)
        run: pnpm run test:unit

      - name: 🧼 Clean Stale Results
        run: rm -rf test-results

      - name: 🔑 Pull Environment Variables
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel env pull .env.local --yes

      - name: Run Full Midnight Validation (Vercel)
        env:
          CI: true
          E2E_SERVER: vercel
          VITE_STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          VITE_STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/report.json
        run: |
          SNAPSHOT_FLAG=""
          if [[ "${{ github.event.inputs.update_snapshots }}" == "true" ]]; then
            SNAPSHOT_FLAG="--update-snapshots"
          fi
          mkdir -p test-results
          npx playwright test $SNAPSHOT_FLAG --reporter=list,json

      - name: Configure Git Safe Directory
        if: always() && github.event.inputs.update_snapshots == 'true'
        run: |
          git config --global --add safe.directory /__w/Scora-app/Scora-app || true

      - name: Direct Commit Updated Snapshots
        if: always() && github.event.inputs.update_snapshots == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(testing): auto-update regression linux snapshots"
          file_pattern: "tests/**/*.png"

      - name: Generate Failure Diagnosis Summary
        if: always()
        run: |
          node scripts/ci-diagnostics.cjs >> $GITHUB_STEP_SUMMARY

      - name: Upload Regression Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: test-results/
          retention-days: 7
