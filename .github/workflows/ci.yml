name: Scora QA Automation

on:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Auto-update Linux snapshots (Direct commit on branches, PR on master)'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - master
      - 'feat/**'
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/docker-publish.yml'
      - '.gitignore'
      - '.dockerignore'
      - '.npmrc'
      - '.agent/**'
      - '.claude/**'
      - '.gemini/**'
      - '.vscode/**'
      - '.env.example'
      - 'azure-pipelines-sample.yml'
  pull_request:
    branches:
      - master
      - 'feat/**'
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/docker-publish.yml'
      - '.gitignore'
      - '.dockerignore'
      - '.npmrc'
      - '.agent/**'
      - '.claude/**'
      - '.gemini/**'
      - '.vscode/**'
      - '.env.example'
      - 'azure-pipelines-sample.yml'

concurrency:
  # 🛡️ Unify concurrency to handle both 'push' and 'pull_request' on the same branch
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  unit-tests:
    name: Core Logic Tests (Vitest)
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24' 
          cache: 'pnpm'
          
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Set up configuration file
        run: cp src/config.example.ts src/config.ts

      - name: Run Unit Tests
        run: pnpm test -- run

  # Prompt/agent evals + code grader (1–10, merged score)
  evals:
    name: Eval Scorecard (cases + code grader)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Snapshot lifecycle audit
        run: npx tsx scripts/snapshot-audit.ts --json > test-results/snapshot-audit.json || true

      - name: Code grader (syntax / secrets / overcode → 1–10)
        run: |
          mkdir -p test-results evals/reports/latest
          npx tsx evals/graders/code-grader.ts --json > test-results/code-grader.json || true

      - name: Eval scorecard (cases 1–10 + strengths/weaknesses/reasoning)
        run: |
          # Fixture mode: score recorded evidence; do not invent green
          npx tsx evals/runners/run-evals.ts || true

      - name: Merge model + code grader
        run: |
          npx tsx evals/graders/merge-graders.ts \
            --code test-results/code-grader.json \
            --model evals/reports/latest/evidence.json || true

      - name: Publish eval summary
        if: always()
        run: |
          {
            echo "## Eval scorecard (1–10)"
            if [ -f evals/reports/latest/scorecard.md ]; then
              echo '```'
              head -40 evals/reports/latest/scorecard.md
              echo '```'
            fi
            if [ -f evals/reports/latest/merged-grader.json ]; then
              echo "### Merged grader"
              echo '```json'
              cat evals/reports/latest/merged-grader.json
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: eval-reports
          path: |
            evals/reports/
            test-results/code-grader.json
            test-results/snapshot-audit.json
          retention-days: 7

  # 🧠 Smart Environment Resolution: STG vs PROD
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Required for git diff origin/master

      - name: Resolve Environment Tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 🧼 Sanitize tag name
          if [ "${{ github.ref_name }}" == "master" ]; then
            SAFE_TAG="latest"
            INFRA_CHANGE=$(git diff --name-only HEAD~1 | grep -qE "Dockerfile.base|package.json" && echo "true" || echo "false")
          else
            TAG="${{ github.head_ref || github.ref_name }}"
            SAFE_TAG=$(echo $TAG | sed 's/\//-/g')
            INFRA_CHANGE=$(git diff --name-only origin/master...HEAD | grep -qE "Dockerfile.base|package.json" && echo "true" || echo "false")
          fi
          
          # 🛰️ Check registry for branch image using GitHub API (with Polling if infra changed)
          MAX_RETRIES=20 # 10 minutes total (20 * 30s)
          RETRY_COUNT=0
          IMAGE_EXISTS="false"

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # Check registry (try orgs first, then users)
            VERSIONS=$(gh api /orgs/${{ github.repository_owner }}/packages/container/scora-runtime/versions --jq '.[] | .metadata.container.tags[]' 2>/dev/null || \
                       gh api /users/${{ github.repository_owner }}/packages/container/scora-runtime/versions --jq '.[] | .metadata.container.tags[]' 2>/dev/null || \
                       echo "")

            IMAGE_EXISTS=$(echo "$VERSIONS" | grep -x "$SAFE_TAG" || echo "false")

            if [ "$IMAGE_EXISTS" == "$SAFE_TAG" ]; then
              break
            fi

            if [ "$INFRA_CHANGE" == "true" ]; then
              echo "⏳ Waiting for Docker image to be ready... (Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES)"
              sleep 30
              RETRY_COUNT=$((RETRY_COUNT + 1))
            else
              # If no infra change, we don't wait for a branch image, we just fall back to latest
              break
            fi
          done

          if [ "$IMAGE_EXISTS" == "$SAFE_TAG" ]; then
            echo "🛡️ Isolated Staging Image Detected: $SAFE_TAG"
            echo "tag=$SAFE_TAG" >> $GITHUB_OUTPUT
          elif [ "$INFRA_CHANGE" == "true" ]; then
            echo "🚨 CRITICAL: Infra changes detected but Docker image did not appear after 10 minutes!"
            exit 1
          else
            echo "🌍 Using Production Baseline: latest"
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

  e2e-tests:
    name: Browser Tests (Playwright / Docker)
    needs: [unit-tests, resolve-env]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/scora-runtime:${{ needs.resolve-env.outputs.image_tag }}
      options: --user root
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: 🛡️ Authorize Workspace Security
        run: git config --global --add safe.directory /__w/Scora-app/Scora-app

      - name: Set up configuration file
        run: cp src/config.example.ts src/config.ts

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect Design Drift
        id: drift
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qE "src/features/editor/|src/templates/|index.html|src/app.ts"; then
            echo "drift_detected=true" >> $GITHUB_OUTPUT
            echo "🎨 Design Drift Detected. Enabling Smart Auto-heal."
          else
            echo "drift_detected=false" >> $GITHUB_OUTPUT
            echo "🛡️ No design changes. Enforcing Strict Mode."
          fi

      - name:  Clean Stale Results
        run: rm -rf test-results blob-report
        
      - name: Pull Environment Variables
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel env pull .env.local --yes

      - name: Run E2E Tests
        shell: bash
        env:
          CI: true
          VITE_STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          VITE_STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/report.json
        run: |
          # HONEST HEALER: baselines update ONLY on explicit manual input.
          # Drift is advisory — never auto-enables --update-snapshots (qa-architecture.md §5.4).
          echo "=== Snapshot policy (propose-only) ==="
          echo "github.event.inputs.update_snapshots: '${{ github.event.inputs.update_snapshots }}'"
          echo "inputs.update_snapshots: '${{ inputs.update_snapshots }}'"
          SNAPSHOT_FLAG=""
          if [ "${{ github.event.inputs.update_snapshots }}" = "true" ] || [ "${{ inputs.update_snapshots }}" = "true" ]; then
            SNAPSHOT_FLAG="--update-snapshots"
            echo "HUMAN ACCEPT: snapshot update enabled for this run"
          else
            echo "Snapshot update disabled (strict). Failures stay red until a human accepts."
          fi

          mkdir -p blob-report test-results
          npx playwright test --project=UI-Core --project=Mobile-Chrome $SNAPSHOT_FLAG --reporter=list,json

          echo "{\"drift_detected\": ${{ steps.drift.outputs.drift_detected }}, \"accept_snapshots\": $([ -n \"$SNAPSHOT_FLAG\" ] && echo true || echo false), \"policy\": \"propose-only\"}" > test-results/TRIAGE_SIGNAL.json

      # Explicit human-approved baseline PR only (never auto-commit on PR/push)
      - name: Open Pull Request with Updated Snapshots (manual accept only)
        if: always() && (github.event.inputs.update_snapshots == 'true' || inputs.update_snapshots == true) && github.ref_name != 'master'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(testing): accepted linux snapshot baselines (human review)"
          branch: ci/snapshot-accept
          delete-branch: true
          title: "CI: Accept snapshot baselines (requested)"
          body: |
            ### Snapshot baseline update (human-initiated)
            Review the image diffs before merge. Merging updates Linux goldens.
            Policy: this PR only opens when `update_snapshots` was explicitly true.
          add-paths: |
            tests/**/*.png

      - name: Open Pull Request with Updated Snapshots (Master Only)
        if: always() && (github.event.inputs.update_snapshots == 'true' || inputs.update_snapshots == true) && github.ref_name == 'master'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(testing): production snapshot calibration [skip ci]"
          branch: ci/prod-snapshot-calibration
          delete-branch: true
          title: "CI: Production Snapshot Calibration (requested)"
          body: |
            ### Production snapshot update (Docker calibrated)
            Merging this will update baseline Linux snapshots.
            Opened only when `update_snapshots` was explicitly true — not on drift.
          add-paths: |
            tests/**/*.png

      - name: Upload Test Report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: blob-report
          path: blob-report/
          retention-days: 2

      - name: Generate Failure Diagnosis Summary
        if: always()
        run: |
          node scripts/ci-diagnostics.cjs >> $GITHUB_STEP_SUMMARY

      - name: Upload Test Results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 2

  smoke-test:
    name: Live Health Check (Post-Deploy)
    needs: e2e-tests
    # Only run on direct pushes to master/main (i.e., after a merge), not on PRs
    if: |
      always() &&
      github.event_name == 'push' &&
      (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Vercel deployment
        run: sleep 30

      - name: Hit /api/health and verify HTTP 200
        id: health_check
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/health_response.json -w "%{http_code}" https://scora-app.vercel.app/api/health)
          echo "Health check response:"
          cat /tmp/health_response.json
          echo ""
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Health check FAILED! App is degraded or down."
            exit 1
          fi
          echo "✅ Health check PASSED! App is healthy."

      - name: Send Slack Alert on Failure
        if: failure() && steps.health_check.outcome == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"⚠️ *CRITICAL ALERT:* The Scora `/api/health` check just failed in production. The app might be down!"}' \
          "$SLACK_WEBHOOK_URL"

