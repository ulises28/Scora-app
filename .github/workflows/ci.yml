name: Scora QA Automation

on:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Set to true to generate a Pull Request with updated Linux snapshots'
        required: false
        type: boolean
        default: false
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  unit-tests:
    name: Core Logic Tests (Vitest)
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24' 
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Set up configuration file
        run: cp src/config.example.ts src/config.ts

      - name: Run Unit Tests
        run: npm test -- run

  e2e-tests:
    name: Browser Tests (Playwright / Docker)
    needs: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up configuration file
        run: cp src/config.example.ts src/config.ts

      - name: Build Playwright Docker Image
        run: docker build -f Dockerfile.playwright -t scora-e2e .

      - name: Run E2E Tests inside Docker
        run: |
          docker run --rm \
            -e CI=true \
            -e VITE_STRAVA_CLIENT_ID=${{ secrets.STRAVA_CLIENT_ID }} \
            -e VITE_STRAVA_CLIENT_SECRET=${{ secrets.STRAVA_CLIENT_SECRET }} \
            -v ${{ github.workspace }}/blob-report:/app/blob-report \
            -v ${{ github.workspace }}/test-results:/app/test-results \
            -v ${{ github.workspace }}/tests:/app/tests \
            scora-e2e \
            npx playwright test ${{ github.event.inputs.update_snapshots == true && '--update-snapshots' || '' }}

      # 🏛️ Smart Self-Healing: Adjusted for Scora "Studio" Flow
      # Feature Branches (!= master): Commit directly to the branch for high-speed iteration.
      # Production (== master): Create a Pull Request for manual verification.
      
      - name: Direct Commit Updated Snapshots (Feature Branches)
        if: github.event.inputs.update_snapshots == true && github.ref_name != 'master'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(testing): auto-update linux snapshots (branch: ${{ github.ref_name }}) [skip ci]"
          file_pattern: "tests/**/*.png tests/e2e/fixtures/sticker-capabilities.json"

      - name: Open Pull Request with Updated Snapshots (Master Only)
        if: github.event.inputs.update_snapshots == true && github.ref_name == 'master'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(testing): production snapshot calibration [skip ci]"
          branch: ci/prod-snapshot-calibration
          delete-branch: true
          title: "🤖 CI: Production Snapshot Calibration"
          body: |
            ### 📸 Production Snapshot Update
            
            This PR was automatically generated because `update_snapshots` was enabled for the `master` branch.
            
            **Action Required**:
            - Verify these changes visually in the "Files changed" tab.
            - Approve and merge if the sticker rendering looks perfect.
          add-paths: |
            tests/**/*.png
            tests/e2e/fixtures/sticker-capabilities.json


      - name: Upload Test Report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: blob-report
          path: blob-report/
          retention-days: 2

      - name: Generate Failure Diagnosis Summary
        if: failure()
        run: |
          echo "### 🔍 Failure Diagnosis Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f test-results/report.json ]; then
            node -e "
              const report = require('./test-results/report.json');
              const failed = report.suites.flatMap(s => s.suites || []).flatMap(s => s.tests || []).filter(t => t.status === 'failed');
              if (failed.length === 0) {
                console.log('No failed tests found in the parsed structure.');
              } else {
                console.log('| Test Case | Error Snippet | Location |');
                console.log('|-----------|---------------|----------|');
                failed.forEach(t => {
                  const error = t.results?.[0]?.error?.message?.split('\n')[0]?.replace(/|/g, ' ') || 'No error message';
                  const location = t.location ? \`\${t.location.file}:\${t.location.line}\` : 'Unknown';
                  console.log(\`| \${t.title} | \${error.slice(0, 100)}... | \${location} |\`);
                });
              }
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No report.json found to diagnose." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Test Results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 2
