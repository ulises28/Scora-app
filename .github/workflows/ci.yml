name: Scora QA Automation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Set to true to generate and commit missing Linux snapshots'
        required: false
        type: boolean
        default: false

# Global environment variables
jobs:
  unit-tests:
    name: Core Logic Tests (Vitest)
    runs-on: ubuntu-24.04
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-tests') }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24' 
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Set up configuration file
        run: cp src/config.example.ts src/config.ts

      - name: Run Unit Tests
        run: npm test -- run

  e2e-tests:
    name: Browser Tests (Playwright / Docker)
    needs: unit-tests # CRITICAL: Only run if unit tests pass
    if: |
      always() && 
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-tests')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up configuration file
        run: cp src/config.example.ts src/config.ts

      - name: Build Playwright Docker Image
        run: docker build -f Dockerfile.playwright -t scora-e2e .

      - name: Run E2E Tests inside Docker
        run: |
          docker run --rm \
            -e CI=true \
            -e VITE_STRAVA_CLIENT_ID=${{ secrets.STRAVA_CLIENT_ID }} \
            -e VITE_STRAVA_CLIENT_SECRET=${{ secrets.STRAVA_CLIENT_SECRET }} \
            -v ${{ github.workspace }}/blob-report:/app/blob-report \
            -v ${{ github.workspace }}/test-results:/app/test-results \
            -v ${{ github.workspace }}/tests:/app/tests \
            scora-e2e \
            npx playwright test ${{ github.event.inputs.update_snapshots == 'true' && '--update-snapshots' || '' }}

      - name: Auto-commit Updated Snapshots (Self-Healing)
        if: github.event.inputs.update_snapshots == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(testing): self-healing linux snapshots [skip ci]"
          file_pattern: "tests/e2e/ui/canvas-rendering.spec.ts-snapshots/*.png"

      - name: Upload Test Report
        uses: actions/upload-artifact@v6
        if: always() # Upload report even if tests fail
        with:
          name: blob-report
          path: blob-report/
          retention-days: 2

      - name: Upload Test Results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 2

