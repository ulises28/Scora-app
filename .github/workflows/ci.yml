name: Scora QA Automation

on:
  push:
    branches: [ "master", "scora-upgrades-3.0" ]
  pull_request:
    branches: [ "master", "scora-upgrades-3.0" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Core Logic Tests (Vitest)
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24' 
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Set up configuration file
        run: cp src/config.example.ts src/config.ts

      - name: Run Unit Tests
        run: npm test -- run

  e2e-tests:
    name: Browser Tests (Playwright / Docker)
    needs: unit-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up configuration file
        run: cp src/config.example.ts src/config.ts

      - name: Build Playwright Docker Image
        run: docker build -f Dockerfile.playwright -t scora-e2e .

      - name: Run E2E Tests inside Docker
        run: |
          docker run --rm \
            -e CI=true \
            -e VITE_STRAVA_CLIENT_ID=${{ secrets.STRAVA_CLIENT_ID }} \
            -e VITE_STRAVA_CLIENT_SECRET=${{ secrets.STRAVA_CLIENT_SECRET }} \
            -v ${{ github.workspace }}/blob-report:/app/blob-report \
            -v ${{ github.workspace }}/test-results:/app/test-results \
            -v ${{ github.workspace }}/tests:/app/tests \
            scora-e2e \
            npx playwright test

      - name: Upload Test Report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: blob-report
          path: blob-report/
          retention-days: 2

      - name: Upload Test Results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 2
