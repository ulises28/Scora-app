name: Scora QA Automation

on:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Auto-update Linux snapshots (Direct commit on branches, PR on master)'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - master
      - 'feat/**'
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches:
      - master
      - 'feat/**'
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/docker-publish.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  unit-tests:
    name: Core Logic Tests (Vitest)
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24' 
          cache: 'pnpm'
          
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Set up configuration file
        run: cp src/config.example.ts src/config.ts

      - name: Run Unit Tests
        run: pnpm test -- run

  # 🧠 Smart Environment Resolution: STG vs PROD
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for git diff origin/master

      - name: Resolve Environment Tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 🧼 Sanitize tag name
          TAG="${{ github.head_ref || github.ref_name }}"
          SAFE_TAG=$(echo $TAG | sed 's/\//-/g')
          
          # 🕵️ Detect if this branch HAS intentional infra changes
          INFRA_CHANGE=$(git diff --name-only origin/master...HEAD | grep -qE "Dockerfile.base|package.json" && echo "true" || echo "false")
          
          # 🛰️ Check registry for branch image using GitHub API (try orgs first, then users)
          VERSIONS=$(gh api /orgs/${{ github.repository_owner }}/packages/container/scora-runtime/versions --jq '.[] | .metadata.container.tags[]' 2>/dev/null || \
                     gh api /users/${{ github.repository_owner }}/packages/container/scora-runtime/versions --jq '.[] | .metadata.container.tags[]' 2>/dev/null || \
                     echo "")

          IMAGE_EXISTS=$(echo "$VERSIONS" | grep -x "$SAFE_TAG" || echo "false")

          if [ "$IMAGE_EXISTS" == "$SAFE_TAG" ]; then
            echo "🛡️ Isolated Staging Image Detected: $SAFE_TAG"
            echo "tag=$SAFE_TAG" >> $GITHUB_OUTPUT
          elif [ "$INFRA_CHANGE" == "true" ]; then
            echo "🚨 CRITICAL: Infra changes detected but Docker image is not ready yet!"
            echo "Please wait for the 'Scora | Build Runtime Image' workflow to finish, then re-run this job."
            exit 1
          else
            echo "🌍 Using Production Baseline: latest"
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

  e2e-tests:
    name: Browser Tests (Playwright / Docker)
    needs: [unit-tests, resolve-env]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/scora-runtime:${{ needs.resolve-env.outputs.image_tag }}
      options: --user root
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: 🛡️ Authorize Workspace Security
        run: git config --global --add safe.directory /__w/Scora-app/Scora-app

      - name: Set up configuration file
        run: cp src/config.example.ts src/config.ts

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect Design Drift
        id: drift
        run: |
          if git diff --name-only HEAD^ HEAD | grep -qE "src/features/editor/|src/templates/|index.html|src/app.ts"; then
            echo "drift_detected=true" >> $GITHUB_OUTPUT
            echo "🎨 Design Drift Detected. Enabling Smart Auto-heal."
          else
            echo "drift_detected=false" >> $GITHUB_OUTPUT
            echo "🛡️ No design changes. Enforcing Strict Mode."
          fi

      - name: Run E2E Tests
        env:
          CI: true
          VITE_STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          VITE_STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Logic: Update snapshots ONLY if manual override is set OR if drift is detected
          SNAPSHOT_FLAG=""
          if [[ "${{ github.event.inputs.update_snapshots }}" == "true" ]] || [[ "${{ steps.drift.outputs.drift_detected }}" == "true" ]]; then
            SNAPSHOT_FLAG="--update-snapshots"
          fi

          mkdir -p blob-report test-results
          npx playwright test --project=UI-Core --project=Mobile-Chrome $SNAPSHOT_FLAG

          # 🕵️ Generate Triage Signal for diagnostics script
          echo "{\"drift_detected\": ${{ steps.drift.outputs.drift_detected }}}" > test-results/TRIAGE_SIGNAL.json
          
      # 🏛️ Smart Self-Healing (Feature Branches)
      # Condition: Auto-run on PRs OR if manual trigger is enabled.
      - name: Direct Commit Updated Snapshots (Feature Branches)
        if: always() && (github.event.inputs.update_snapshots == 'true' || github.event_name == 'pull_request') && github.ref_name != 'master'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(testing): self-healing linux snapshots (docker-matrix)"
          file_pattern: "tests/**/*.png tests/e2e/fixtures/sticker-capabilities.json"

      - name: Open Pull Request with Updated Snapshots (Master Only)
        if: always() && (github.event.inputs.update_snapshots == 'true' || github.event_name == 'push') && github.ref_name == 'master'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(testing): production snapshot calibration [skip ci]"
          branch: ci/prod-snapshot-calibration
          delete-branch: true
          title: "🤖 CI: Production Snapshot Calibration"
          body: |
            ### 📸 Production Snapshot Update (Docker Calibrated)
            Merging this will update baseline Linux snapshots.
          add-paths: |
            tests/**/*.png
            tests/e2e/fixtures/sticker-capabilities.json

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report
          path: blob-report/
          retention-days: 2

      - name: Generate Failure Diagnosis Summary
        if: always()
        run: |
          node scripts/ci-diagnostics.cjs >> $GITHUB_STEP_SUMMARY

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 2
